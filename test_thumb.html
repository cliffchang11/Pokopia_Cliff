<!DOCTYPE html>
<html>
<head>
<style>
.pkm-table-hab-thumb {
  position: relative;
  width: clamp(180px, 18vw, 260px);
  height: auto;
  aspect-ratio: 3 / 2;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  border: 1.5px solid #ccc;
}
.pkm-table-hab-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
</head>
<body style="margin:0; padding:20px; background:#f0f0f0;">
  <div style="width: 375px;">
    <div class="pkm-table-hab-thumb">
      <img src="assets/habitats/hab_001.webp">
    </div>
  </div>
</body>
</html>
