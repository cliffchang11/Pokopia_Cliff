<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>妙蛙草 3D 模型雙版本對照 - Pokopia</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-pink: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.95) 0px, transparent 100%);
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.75rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    /* 頂部說明條 */
    .info-banner {
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .info-banner strong {
      color: #38bdf8;
    }

    /* 主體雙視窗網格 */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.25rem;
      max-width: 1920px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* 模型展示卡片 */
    .compare-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.4);
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .pill-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
    }

    .pill-1800 {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .pill-latest {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-details {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-canvas-wrap {
      flex: 1;
      min-height: 520px;
      position: relative;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.95) 100%);
      cursor: grab;
    }

    .card-canvas-wrap:active {
      cursor: grabbing;
    }

    .card-canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .card-footer {
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-reset-view {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-reset-view:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    /* 浮動特徵清單 */
    .features-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .feature-item {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="header-brand">
      <div class="header-title">🌿 妙蛙草雙版本 3D 模型對照</div>
      <div class="header-badge">模型比較視窗</div>
    </div>
    <div class="header-actions">
      <a href="/" class="btn-back">⬅️ 返回主首頁</a>
    </div>
  </header>

  <!-- 提示條 -->
  <div class="info-banner">
    💡 <strong>操作指南：</strong>左右兩側 3D 視窗各自支援<strong>獨立 360° 任意旋轉與滾輪縮放</strong>。您可隨意旋轉細看兩者差異，看完後請回到對話告訴我您要保留哪一個版本。
  </div>

  <!-- 主體對照區域 -->
  <main>
    <!-- 左側：18:00 版本 -->
    <div class="compare-card" id="card1800">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-title">18:00 傍晚存檔</div>
          <span class="pill-tag pill-1800">1,321 顆自訂方塊</span>
        </div>
        <div class="card-details">
          <span>基礎身形與原始深淺斑紋</span>
        </div>
      </div>
      <div class="card-canvas-wrap" id="wrap1800">
        <canvas id="canvas1800"></canvas>
      </div>
      <div class="card-footer">
        <div class="features-list">
          <span class="feature-item">👀 初始眼眶</span>
          <span class="feature-item">🐾 早期腳底爪型</span>
          <span class="feature-item">🎨 花紋 246 顆</span>
        </div>
        <button class="btn-reset-view" id="btnReset1800">🔄 重設視角</button>
      </div>
    </div>

    <!-- 右側：最新快取固化版 (11,726 筆) -->
    <div class="compare-card" id="cardLatest">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-title">最新快取固化版</div>
          <span class="pill-tag pill-latest">11,726 筆自訂修改 (1,240 著色 + 10,486 掏空)</span>
        </div>
        <div class="card-details">
          <span>包含電腦端完成的所有精雕與造型細節</span>
        </div>
      </div>
      <div class="card-canvas-wrap" id="wrapLatest">
        <canvas id="canvasLatest"></canvas>
      </div>
      <div class="card-footer">
        <div class="features-list">
          <span class="feature-item">🎨 著色 1,240 顆</span>
          <span class="feature-item">🪓 掏空 10,486 顆</span>
          <span class="feature-item">✨ 完整眼眶眼神光</span>
          <span class="feature-item">🌿 立體斑紋與尖牙</span>
        </div>
        <button class="btn-reset-view" id="btnResetLatest">🔄 重設視角</button>
      </div>
    </div>
  </main>

  <!-- 外部依賴資源 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="ivysaur_voxel_data.js"></script>
  <script src="compare_data.js"></script>

  <!-- 3D 渲染控制核心邏輯 -->
  <script>
    (function () {
      if (typeof THREE === 'undefined') {
        console.error('Three.js failed to load');
        return;
      }

      // 產生方塊外框紋理 (與主專案風格一致)
      function createOutlineTexture() {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        if (!ctx) return null;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 64, 64);
        ctx.strokeStyle = 'rgba(25, 25, 25, 0.72)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(1, 1, 62, 62);
        const texture = new THREE.CanvasTexture(c);
        texture.magFilter = THREE.NearestFilter;
        texture.minFilter = THREE.NearestFilter;
        return texture;
      }

      const outlineMap = createOutlineTexture();

      // 建立單一獨立 3D 檢視器
      function createModelViewer(canvasId, wrapId, overrides) {
        const canvas = document.getElementById(canvasId);
        const wrap = document.getElementById(wrapId);
        if (!canvas || !wrap) return null;

        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 1, 2000);
        camera.position.set(110, 80, 125);

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: true
        });
        renderer.setSize(wrap.clientWidth, wrap.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        // 光源配置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.75);
        dirLight1.position.set(80, 120, 80);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xf472b6, 0.35);
        dirLight2.position.set(-80, 50, -80);
        scene.add(dirLight2);

        const dirLight3 = new THREE.DirectionalLight(0x064e3b, 0.2);
        dirLight3.position.set(0, -60, 0);
        scene.add(dirLight3);

        // OrbitControls (純獨立手動控制)
        let controls = null;
        if (typeof THREE.OrbitControls !== 'undefined') {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.08;
          controls.target.set(0, 0, 0);
          controls.maxDistance = 500;
          controls.minDistance = 25;
        }

        // 模型建構
        const data = (typeof IVYSAUR_VOXEL_DATA !== 'undefined') ? IVYSAUR_VOXEL_DATA : null;
        if (!data || !data.layers) return null;

        const totalCount = data.totalBlocks;
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({
          map: outlineMap,
          roughness: 0.88,
          metalness: 0.0
        });

        const instancedMesh = new THREE.InstancedMesh(geometry, material, totalCount);
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        const cx = data.dimensions.width / 2;
        const cy = data.dimensions.height / 2;
        const cz = data.dimensions.length / 2;

        const origBlockMap = new Map();
        let idx = 0;

        // 遍歷基礎層與方塊
        data.layers.forEach(layer => {
          const y = layer.layerIndex - 1;
          const posY = y - cy + 0.5;
          layer.blocks.forEach(b => {
            const x = b[0];
            const z = b[1];
            const origBid = b[2];
            origBlockMap.set(`${x},${y},${z}`, origBid);

            const posX = x - cx + 0.5;
            const posZ = z - cz + 0.5;
            dummy.position.set(posX, posY, posZ);

            // 檢查 overrides
            const key = `${x},${y},${z}`;
            let effBid = origBid;
            if (overrides && overrides[key] !== undefined) {
              effBid = overrides[key];
            }

            if (effBid === -1) {
              dummy.scale.set(0, 0, 0);
            } else {
              dummy.scale.set(1, 1, 1);
              const pItem = (data.palette && data.palette[effBid]) ? data.palette[effBid] : { color: '#00a8c8' };
              color.set(pItem.color);
              instancedMesh.setColorAt(idx, color);
            }

            dummy.updateMatrix();
            instancedMesh.setMatrixAt(idx, dummy.matrix);
            idx++;
          });
        });

        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        // 檢查自訂新增方塊 (origBlockMap 中沒有的)
        const dynamicGroup = new THREE.Group();
        if (overrides) {
          Object.entries(overrides).forEach(([k, bid]) => {
            if (bid !== -1 && !origBlockMap.has(k)) {
              const [x, y, z] = k.split(',').map(Number);
              const pItem = (data.palette && data.palette[bid]) ? data.palette[bid] : { color: '#00a8c8' };
              const cubeMat = new THREE.MeshStandardMaterial({
                map: outlineMap,
                color: pItem.color,
                roughness: 0.88,
                metalness: 0.0
              });
              const cube = new THREE.Mesh(geometry, cubeMat);
              cube.position.set(x - cx + 0.5, y - cy + 0.5, z - cz + 0.5);
              dynamicGroup.add(cube);
            }
          });
        }
        scene.add(dynamicGroup);

        // 動畫渲染循環
        let isRunning = true;
        function animate() {
          if (!isRunning) return;
          requestAnimationFrame(animate);
          if (controls) controls.update();
          renderer.render(scene, camera);
        }
        animate();

        // 響應式尺寸更新
        function onResize() {
          if (!wrap) return;
          const w = wrap.clientWidth;
          const h = wrap.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // 重設視角函式
        function resetView() {
          camera.position.set(110, 80, 125);
          if (controls) {
            controls.target.set(0, 0, 0);
            controls.update();
          }
        }

        return { resetView, destroy: () => { isRunning = false; window.removeEventListener('resize', onResize); } };
      }

      // 初始化左右兩個對照視窗
      window.addEventListener('DOMContentLoaded', () => {
        const ov1800 = (typeof IVYSAUR_OVERRIDES_1800 !== 'undefined') ? IVYSAUR_OVERRIDES_1800 : {};
        const ovLatest = (typeof IVYSAUR_OVERRIDES_LATEST !== 'undefined') ? IVYSAUR_OVERRIDES_LATEST : {};

        const viewer1800 = createModelViewer('canvas1800', 'wrap1800', ov1800);
        const viewerLatest = createModelViewer('canvasLatest', 'wrapLatest', ovLatest);

        const btn1800 = document.getElementById('btnReset1800');
        if (btn1800 && viewer1800) {
          btn1800.addEventListener('click', () => viewer1800.resetView());
        }

        const btnLatest = document.getElementById('btnResetLatest');
        if (btnLatest && viewerLatest) {
          btnLatest.addEventListener('click', () => viewerLatest.resetView());
        }
      });
    })();
  </script>
</body>
</html>
